name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22.13.0"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static export
        run: npm run build:pages

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist/client

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      # Steht Pages auf "Deploy from a branch", veröffentlicht GitHub bei jedem Push
      # zusätzlich die README als Seite. Erst danach veröffentlichen, sonst
      # überschreibt dieser Branch-Build den Export.
      - name: Wait for the branch-based Pages build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in $(seq 1 40); do
            running=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${GITHUB_SHA}&per_page=100" \
              --jq '[.workflow_runs[] | select(.path == "dynamic/pages/pages-build-deployment" and .status != "completed")] | length')
            if [ "$running" = "0" ]; then exit 0; fi
            echo "Branch-Build läuft noch (Versuch $attempt) ..."
            sleep 10
          done
          echo "Branch-Build nach 400 Sekunden nicht fertig; es wird trotzdem veröffentlicht."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#efede5">
  <title>Farbtreffer — Ein Farbton. Ein Schuss.</title>
  <style>
    :root { color-scheme: light; --paper:#efede5; --ink:#282d2d; --muted:#777970; --orange:#b65036; --line:#d1cfc4; }
    * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
    html,body { margin:0; width:100%; height:100%; overflow:hidden; overscroll-behavior:none; }
    body { background:var(--paper); color:var(--ink); font-family:Arial,Helvetica,sans-serif; }
    button { font:inherit; color:inherit; cursor:pointer; touch-action:manipulation; }
    button:focus-visible { outline:3px solid #b65036; outline-offset:3px; }
    .app { width:min(100%,800px); height:100vh; height:100dvh; margin:auto; padding:clamp(12px,2.5vh,24px) clamp(12px,3vw,28px); display:grid; grid-template-rows:auto auto minmax(0,1fr) auto; gap:12px; }
    .header { display:flex; justify-content:space-between; align-items:center; min-height:42px; }
    .brand { display:flex; align-items:baseline; gap:8px; user-select:none; }
    h1 { margin:0; font-family:Georgia,'Times New Roman',serif; letter-spacing:-1.5px; font-size:31px; font-weight:normal; }
    h1 span { color:var(--orange); }
    .edition { border-left:1px solid var(--line); margin-left:3px; padding-left:11px; font-size:9px; letter-spacing:1.6px; line-height:1.7; }
    .controls { display:flex; gap:7px; flex-shrink:0; }
    .icon-button { width:44px; height:44px; border:1px solid #c7c7bc; background:transparent; border-radius:50%; display:grid; place-items:center; color:inherit; }
    a.icon-button:focus-visible { outline:3px solid #b65036; outline-offset:3px; }
    .icon-button svg { width:18px; height:18px; }
    .icon-button:disabled { opacity:.35; cursor:default; }
    .hud { border-top:1px solid var(--ink); border-bottom:1px solid var(--line); padding:11px 0 13px; display:grid; grid-template-columns:.85fr 1.15fr 1.15fr 1fr; }
    .stat { padding-left:14px; border-left:1px solid var(--line); min-width:0; }
    .stat:first-child { border-left:0; padding-left:0; }
    .stat-label { font-size:9px; letter-spacing:1.6px; color:var(--muted); line-height:1.5; text-transform:uppercase; }
    .stat-value { margin-top:4px; font-size:27px; font-variant-numeric:tabular-nums; line-height:1; letter-spacing:-1px; }
    .hearts { margin-top:6px; display:flex; gap:5px; height:24px; align-items:center; }
    .hearts svg { width:18px; height:20px; }
    .game { position:relative; isolation:isolate; min-height:0; border:1px solid #202627; border-radius:6px; overflow:hidden; background:#2b3031; box-shadow:0 8px 22px #20232414; }
    canvas { display:block; width:100%; height:100%; touch-action:none; user-select:none; -webkit-user-select:none; }
    canvas.dragging { cursor:grabbing; }
    .overlay { position:absolute; inset:0; z-index:1; display:flex; align-items:center; justify-content:center; padding:12px; background:#1920217d; backdrop-filter:blur(3px); -webkit-backdrop-filter:blur(3px); }
    .overlay[hidden] { display:none; }
    .panel { width:min(100%,382px); max-height:100%; overflow:auto; overscroll-behavior:contain; background:#f6f3eb; border:1px solid #d0cbbb; border-radius:3px; padding:27px; box-shadow:0 15px 60px #111b; }
    .eyebrow { color:var(--orange); font-size:9px; letter-spacing:2.5px; font-weight:700; text-transform:uppercase; margin:0 0 14px; }
    .panel h2 { font-family:Georgia,'Times New Roman',serif; font-weight:normal; font-size:40px; line-height:1.06; letter-spacing:-1.4px; margin:0 0 16px; }
    .panel p { margin:0 0 14px; color:#62665e; font-size:13px; line-height:1.6; }
    .panel strong { color:#303631; font-weight:600; }
    .rule { display:flex; align-items:center; gap:13px; margin:17px 0; padding:13px 0; border-top:1px solid var(--line); border-bottom:1px solid var(--line); }
    .rule-number { font-family:Georgia,'Times New Roman',serif; font-size:39px; line-height:1; }
    .rule-copy { font-size:11px; color:#62665e; line-height:1.5; }
    .difficulty-label { font-size:9px; letter-spacing:1.4px; text-transform:uppercase; color:#62665e; margin:0 0 7px; }
    .difficulty { display:flex; border:1px solid #c9c7bc; margin-bottom:17px; }
    .difficulty button { flex:1; border:0; background:transparent; font-size:12px; padding:10px 4px; }
    .difficulty button+button { border-left:1px solid #c9c7bc; }
    .difficulty button[aria-pressed="true"] { background:#303735; color:#f9f6ee; }
    .time-difficulty button span { display:block; margin-top:3px; font-size:9px; opacity:.7; }
    .primary { border:1px solid #303735; background:#303735; color:#fffaf0; width:100%; padding:15px; font-size:14px; font-weight:600; display:flex; justify-content:space-between; align-items:center; }
    .primary svg { width:18px; height:18px; }
    .secondary { border:1px solid #c6c5b9; background:transparent; width:100%; padding:12px; margin-top:9px; font-size:12px; }
    .fineprint { margin:13px 0 0!important; font-size:10px!important; text-align:center; }
    .result-score { font-size:62px; letter-spacing:-3px; margin:7px 0 15px; line-height:1; font-variant-numeric:tabular-nums; }
    .result-meta { display:flex; justify-content:space-between; padding:12px 0; border-top:1px solid var(--line); margin-bottom:18px; font-size:11px; color:#62665e; }
    .result-meta b { color:#303631; }
    .footer { display:flex; justify-content:space-between; align-items:center; gap:8px; min-height:20px; font-size:10px; color:#777970; }
    .hint { line-height:1.35; }
    .keyboard-hint { white-space:nowrap; font-size:9px; color:#96968c; }
    @media (max-width:480px) {
      .app { gap:9px; padding:12px; padding-top:max(12px,env(safe-area-inset-top)); padding-bottom:max(9px,env(safe-area-inset-bottom)); }
      h1 { font-size:27px; }
      .edition { display:none; }
      .hud { padding:9px 0 11px; }
      .stat { padding-left:10px; }
      .stat-value { font-size:24px; }
      .stat-label { font-size:8px; letter-spacing:1px; }
      .hearts { gap:3px; height:20px; }
      .hearts svg { width:16px; height:18px; }
      .panel { padding:22px; }
      .panel h2 { font-size:34px; }
      .panel p { font-size:12px; }
    }
    @media (pointer:coarse) { .keyboard-hint { display:none; } }
    @media (max-height:700px) and (orientation:portrait) {
      .panel { padding:18px 20px; }
      .panel h2 { font-size:30px; margin-bottom:10px; }
      .eyebrow { margin-bottom:8px; }
      .panel p { margin-bottom:9px; }
      .rule { margin:11px 0; padding:9px 0; }
      .rule-number { font-size:32px; }
      .difficulty { margin-bottom:12px; }
      .primary { padding:13px; }
      .fineprint { margin-top:9px!important; }
    }
    @media (max-height:540px) and (orientation:landscape) and (min-width:580px) {
      .app { width:min(100%,1050px); padding:12px; grid-template-columns:170px minmax(0,1fr); grid-template-rows:72px minmax(0,1fr) 38px; gap:12px; }
      .header { grid-column:1; grid-row:1; flex-direction:column; align-items:flex-start; justify-content:flex-start; gap:6px; }
      h1 { font-size:22px; letter-spacing:-1px; }
      .edition { display:none; }
      .icon-button { width:33px; height:33px; }
      .hud { grid-column:1; grid-row:2; grid-template-columns:1fr 1fr; gap:14px 0; align-content:center; }
      .stat { padding-left:12px; }
      .stat:nth-child(3) { padding-left:0; border-left:0; }
      .stat-value { font-size:23px; }
      .stat-label { font-size:8px; }
      .game { grid-column:2; grid-row:1 / 4; }
      .footer { grid-column:1; grid-row:3; font-size:9px; }
      .keyboard-hint { display:none; }
      .panel { width:min(100%,430px); padding:17px 22px; }
      .panel h2 { font-size:27px; margin-bottom:8px; }
      .panel h2 br { display:none; }
      .eyebrow { margin-bottom:7px; }
      .panel p { font-size:11px; margin-bottom:8px; }
      .rule { margin:8px 0; padding:7px 0; }
      .rule-number { font-size:28px; }
      .difficulty { margin-bottom:10px; }
      .difficulty button { padding:7px 4px; }
      .primary { padding:10px 13px; }
      .fineprint { margin-top:7px!important; }
    }
    @media (prefers-reduced-motion:reduce) { .overlay { backdrop-filter:none; -webkit-backdrop-filter:none; } }
  </style>
</head>
<body>
  <main class="app" aria-label="Farbtreffer — Farbvergleichsspiel">
    <header class="header">
      <div class="brand"><h1>Farb<span>treffer.</span></h1><div class="edition">EIN TON.<br>EIN SCHUSS.</div></div>
      <div class="controls">
        <a class="icon-button" href="../" aria-label="Zurück zu Hanna's Spiele" title="Zurück zu Hanna's Spiele"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M20 12H5m6-6-6 6 6 6"/></svg></a>
        <button class="icon-button" id="sound" aria-label="Ton ausschalten" aria-pressed="true" title="Ton ausschalten"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M4 9h4l5-4v14l-5-4H4zM16 8c3 2 3 6 0 8M19 5c5 4 5 10 0 14"/></svg></button>
        <button class="icon-button" id="pause" aria-label="Spiel pausieren" title="Pause (P oder Escape)" disabled><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3"><path d="M8 5v14M16 5v14"/></svg></button>
      </div>
    </header>
    <section class="hud" aria-label="Spielstand">
      <div class="stat"><div class="stat-label">Runde</div><div class="stat-value" id="round">01</div></div>
      <div class="stat"><div class="stat-label">Punkte</div><div class="stat-value" id="score">0</div></div>
      <div class="stat"><div class="stat-label">Bestwert</div><div class="stat-value" id="best">0</div></div>
      <div class="stat"><div class="stat-label">Versuche</div><div class="hearts" id="lives" role="img" aria-label="3 Versuche übrig"></div></div>
    </section>
    <section class="game" id="game" aria-label="Spielfeld">
      <canvas id="board" aria-label="Oben die Farbvorlage, darunter fünf Kugeln. Unten die Pistole horizontal ziehen und zum Schießen loslassen. Am PC mit den Pfeiltasten bewegen und mit der Leertaste schießen."></canvas>
      <section class="overlay" id="overlay" role="dialog" aria-modal="true" aria-labelledby="panel-title"><div class="panel" id="panel"></div></section>
    </section>
    <footer class="footer"><span class="hint" id="hint" role="status" aria-live="polite">Unten ziehen · Loslassen = Schuss</span><span class="keyboard-hint">← → bewegen &nbsp;·&nbsp; Leertaste schießen</span></footer>
  </main>
  <script>
  (() => {
    'use strict';
    const $ = id => document.getElementById(id);
    const canvas = $('board'), ctx = canvas.getContext('2d', { alpha:false });
    const overlay = $('overlay'), panel = $('panel');
    const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    const TIME_MODES = {
      easy: { label:'Einfach', seconds:4 },
      medium: { label:'Mittel', seconds:3 },
      hard: { label:'Schwer', seconds:2 }
    };
    const MODES = {
      gentle: { label:'Sanft', step:10 },
      fine: { label:'Fein', step:6 },
      expert: { label:'Sehr fein', step:3.5 }
    };
    const COLORS = [
      { h:8, s:71, name:'Koralle' }, { h:28, s:78, name:'Mandarine' },
      { h:44, s:75, name:'Bernstein' }, { h:64, s:62, name:'Limette' },
      { h:88, s:58, name:'Farn' }, { h:112, s:56, name:'Blattgrün' },
      { h:141, s:56, name:'Jade' }, { h:166, s:63, name:'Minze' },
      { h:183, s:64, name:'Türkis' }, { h:201, s:68, name:'Azur' },
      { h:220, s:70, name:'Kornblume' }, { h:242, s:66, name:'Indigo' },
      { h:263, s:62, name:'Veilchen' }, { h:286, s:61, name:'Orchidee' },
      { h:313, s:62, name:'Magenta' }, { h:338, s:67, name:'Himbeere' }
    ];
    const STORAGE_KEY = 'farbtreffer.records.v2';
    let records = Object.fromEntries(Object.keys(TIME_MODES).map(k=>[k,{gentle:0,fine:0,expert:0}]));
    try {
      const current = localStorage.getItem(STORAGE_KEY);
      // Existing scores were earned with three seconds and belong to "Mittel".
      const saved = current?JSON.parse(current):{medium:JSON.parse(localStorage.getItem('farbtreffer.records.v1') || '{}')};
      for (const timing of Object.keys(records)) {
        for (const brightness of Object.keys(MODES)) {
          const value = saved && saved[timing] && saved[timing][brightness];
          if (Number.isSafeInteger(value) && value >= 0) records[timing][brightness] = value;
        }
      }
    } catch (_) {}
    let W=360, H=520, DPR=1, lastFrame=performance.now(), mode='fine', timeMode='medium';
    let pointerId=null, keys={left:false,right:false}, spaceDown=false, paletteBag=[];
    const G = {
      phase:'intro', round:0, score:0, lives:3, hits:0, streak:0, bestAtStart:0,
      recordTime:'medium', recordMode:'fine',
      seconds:TIME_MODES.medium.seconds, deadline:0, feedbackEnd:0, feedback:null, gunX:0.5, recoil:0,
      balls:[], target:null, color:COLORS[0], shot:null, particles:[], pop:null, bounce:null, paused:null, previousHue:null
    };
    const clamp = (n,a,b) => Math.max(a,Math.min(b,n));
    const random = (a,b) => a+Math.random()*(b-a);
    const SPEEDUP_HITS=5, MIN_SECONDS=0.5;
    // Every five hits shorten all following rounds by 0.1 seconds, on every difficulty.
    const secondsAfter = hits => Math.max(MIN_SECONDS,(TIME_MODES[timeMode].seconds*10-Math.floor(hits/SPEEDUP_HITS))/10);
    // G.seconds is fixed for the running round, so timer, sound and score agree.
    const roundSeconds = () => G.seconds;
    const SOUND_KEY='farbtreffer.sound.v1';
    let soundOn=true, soundAvailable=!!(window.AudioContext || window.webkitAudioContext);
    let audio=null, riser=null;
    const voices=new Set();
    try { soundOn=localStorage.getItem(SOUND_KEY)!=='off'; } catch (_) {}
    function updateSoundButton() {
      const label=soundAvailable?(soundOn?'Ton ausschalten':'Ton einschalten'):'Ton in diesem Browser nicht verfügbar';
      $('sound').disabled=!soundAvailable;
      $('sound').setAttribute('aria-label',label);
      $('sound').setAttribute('title',label);
      $('sound').setAttribute('aria-pressed',String(soundOn && soundAvailable));
      $('sound').innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z'+(soundOn && soundAvailable?'M16 8c3 2 3 6 0 8M19 5c5 4 5 10 0 14':'M17 9l5 6M22 9l-5 6')+'"/></svg>';
    }
    function ensureAudio() {
      if (!soundOn || !soundAvailable) return false;
      try {
        if (!audio) {
          const Audio=window.AudioContext || window.webkitAudioContext;
          const context=new Audio();
          const master=context.createGain(); master.gain.value=0.36; master.connect(context.destination);
          const noise=context.createBuffer(1,Math.ceil(context.sampleRate*2),context.sampleRate);
          const samples=noise.getChannelData(0);
          for (let i=0;i<samples.length;i++) samples[i]=Math.random()*2-1;
          audio={context,master,noise};
        }
        audio.master.gain.setTargetAtTime(0.36,audio.context.currentTime,0.015);
        if (audio.context.state!=='running') {
          audio.context.resume().then(()=>{
            if (soundOn && G.phase==='aim') startRiser((G.deadline-performance.now())/1000);
          }).catch(()=>{});
        }
        return audio.context.state==='running';
      } catch (_) { soundAvailable=false; updateSoundButton(); return false; }
    }
    function voice() {
      const bus=audio.context.createGain(); bus.connect(audio.master);
      const v={bus,sources:[],nodes:[],released:false}; voices.add(v); return v;
    }
    function scheduleVoice(v,sources,end) {
      v.sources=sources.map(item=>item.node);
      let active=sources.length;
      for (const item of sources) {
        item.node.onended=()=>{
          if (--active>0) return;
          voices.delete(v);
          if (riser===v) riser=null;
          for (const node of [...v.sources,...v.nodes,v.bus]) { try { node.disconnect(); } catch (_) {} }
        };
        item.node.start(item.start);
        item.node.stop(item.end===undefined?end:item.end);
      }
    }
    function stopVoice(v) {
      if (!v || v.released || !audio) return;
      v.released=true;
      const t=audio.context.currentTime, gain=v.bus.gain;
      if (gain.cancelAndHoldAtTime) gain.cancelAndHoldAtTime(t);
      else { const value=gain.value; gain.cancelScheduledValues(t); gain.setValueAtTime(value,t); }
      gain.linearRampToValueAtTime(0,t+0.02);
      for (const source of v.sources) { try { source.stop(t+0.022); } catch (_) {} }
    }
    function stopRiser() { const current=riser; riser=null; stopVoice(current); }
    function stopAllSounds() { stopRiser(); for (const v of voices) stopVoice(v); }
    function startRiser(remaining=(G.deadline-performance.now())/1000) {
      stopRiser();
      if (!soundOn || !audio || audio.context.state!=='running' || G.phase!=='aim' || remaining<=0) return;
      const c=audio.context,t=c.currentTime,duration=clamp(remaining,0.001,roundSeconds()),progress=1-duration/roundSeconds();
      const v=voice(); riser=v;
      const filter=c.createBiquadFilter(); filter.type='lowpass'; filter.Q.value=0.65;
      filter.frequency.setValueAtTime(450*Math.pow(12,progress),t);
      filter.frequency.exponentialRampToValueAtTime(5400,t+duration);
      filter.connect(v.bus); v.nodes.push(filter);
      v.bus.gain.setValueAtTime(0,t);
      v.bus.gain.linearRampToValueAtTime(0.35+0.4*progress,t+Math.min(0.035,duration*0.3));
      v.bus.gain.linearRampToValueAtTime(0.75,t+duration);
      v.bus.gain.linearRampToValueAtTime(0,t+duration+0.025);
      const noise=c.createBufferSource(),noiseGain=c.createGain();
      noise.buffer=audio.noise; noise.loop=true;
      noiseGain.gain.setValueAtTime(0.055+progress*0.095,t);
      noiseGain.gain.linearRampToValueAtTime(0.15,t+duration);
      noise.connect(noiseGain); noiseGain.connect(filter); v.nodes.push(noiseGain);
      const sources=[{node:noise,start:t}];
      for (const [base,type,level] of [[130,'sawtooth',0.055],[65,'sine',0.13]]) {
        const osc=c.createOscillator(),gain=c.createGain(); osc.type=type;
        osc.frequency.setValueAtTime(base*Math.pow(9,progress),t);
        osc.frequency.exponentialRampToValueAtTime(base*9,t+duration);
        gain.gain.value=level; osc.connect(gain); gain.connect(filter); v.nodes.push(gain);
        sources.push({node:osc,start:t});
      }
      scheduleVoice(v,sources,t+duration+0.03);
    }
    function playShotSound() {
      if (!soundOn || !audio || audio.context.state!=='running') return;
      const c=audio.context,t=c.currentTime,v=voice(),end=t+0.17;
      v.bus.gain.setValueAtTime(0.0001,t);
      v.bus.gain.linearRampToValueAtTime(0.6,t+0.003);
      v.bus.gain.exponentialRampToValueAtTime(0.0001,end);
      const noise=c.createBufferSource(),filter=c.createBiquadFilter(),noiseGain=c.createGain();
      noise.buffer=audio.noise; filter.type='bandpass'; filter.frequency.value=1800; filter.Q.value=0.7;
      noiseGain.gain.value=0.4; noise.connect(filter); filter.connect(noiseGain); noiseGain.connect(v.bus);
      const osc=c.createOscillator(),toneGain=c.createGain(); osc.type='triangle';
      osc.frequency.setValueAtTime(620,t); osc.frequency.exponentialRampToValueAtTime(125,t+0.13);
      toneGain.gain.value=0.3; osc.connect(toneGain); toneGain.connect(v.bus);
      v.nodes.push(filter,noiseGain,toneGain);
      scheduleVoice(v,[{node:noise,start:t},{node:osc,start:t}],end+0.01);
    }
    function playResultSound(success) {
      if (!soundOn || !audio || audio.context.state!=='running') return;
      const c=audio.context,t=c.currentTime,v=voice(),notes=success?[660,880,1100]:[220,147];
      v.bus.gain.value=0.5;
      const sources=[];
      notes.forEach((frequency,i)=>{
        const start=t+i*(success?0.065:0.09),end=start+(success?0.22:0.19);
        const osc=c.createOscillator(),gain=c.createGain(); osc.type=success?'sine':'triangle';
        osc.frequency.setValueAtTime(frequency,start);
        gain.gain.setValueAtTime(0.0001,start); gain.gain.linearRampToValueAtTime(success?0.4:0.34,start+0.007);
        gain.gain.exponentialRampToValueAtTime(0.0001,end);
        osc.connect(gain); gain.connect(v.bus); v.nodes.push(gain);
        sources.push({node:osc,start,end:end+0.01});
      });
      scheduleVoice(v,sources,t+0.4);
    }
    function toggleSound() {
      soundOn=!soundOn;
      try { localStorage.setItem(SOUND_KEY,soundOn?'on':'off'); } catch (_) {}
      if (!soundOn) {
        stopAllSounds();
        if (audio) audio.master.gain.setTargetAtTime(0,audio.context.currentTime,0.015);
      } else if (ensureAudio() && G.phase==='aim') startRiser();
      updateSoundButton();
    }
    function shuffle(a) {
      for (let i=a.length-1;i>0;i--) { const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
      return a;
    }
    function layout() {
      const padding = Math.max(13,Math.min(35,W*0.035));
      const lane = (W-2*padding)/5;
      const headerBottom = H<290?94:H<390?112:132;
      const radius = Math.min(35,lane*0.405,Math.max(6,(H-headerBottom-145)/2));
      const railTop = H-108;
      const top = headerBottom+12+radius;
      const bottom = Math.max(top,railTop-radius-28);
      return { padding,lane,radius,railTop,top,bottom,gunY:H-52,headerBottom,referenceY:H<290?48:H<390?57:67 };
    }
    function ballPosition(ball,L=layout()) {
      return { x:L.padding+(ball.lane+0.5)*L.lane, y:L.top+(L.bottom-L.top)*ball.depth, r:L.radius };
    }
    function updateHud() {
      $('round').textContent=String(Math.max(1,G.round)).padStart(2,'0');
      $('score').textContent=G.score.toLocaleString('de-DE');
      $('best').textContent=records[timeMode][mode].toLocaleString('de-DE');

        ctx.save(); ctx.setLineDash([2,9]); line(gunX,L.gunY-67,gunX,L.headerBottom+7,'#d7e3ce28'); ctx.restore();
        line(gunX-5,L.headerBottom+8,gunX+5,L.headerBottom+8,'#b5c1ac4d');
      }
      for (const ball of G.balls) {
        const p=ballPosition(ball,L), popped=G.pop && G.pop.ball===ball;
        if (popped) drawPop(p,G.pop.age,ball.css);
        else {
          // A sphere that deflects the shot shudders briefly.
          const shake=G.bounce && G.bounce.ball===ball?Math.sin(G.bounce.age*70)*3*Math.max(0,1-G.bounce.age/0.3):0;
          drawSphere(p.x+shake,p.y,p.r,ball.css);
        }
        if (G.feedback && ball.correct) {
          if (!popped) { ctx.beginPath(); ctx.arc(p.x,p.y,p.r+6,0,Math.PI*2); ctx.strokeStyle=G.feedback.kind==='correct'?'#d5e8c7':'#f3dab2'; ctx.lineWidth=1.6; ctx.stroke(); }
          checkMark(p.x,p.y+p.r+17,9,G.feedback.kind==='correct'?'#d5e8c7':'#f3dab2');
        }
        if (G.feedback && G.feedback.kind==='wrong' && G.feedback.hit===ball) {
          line(p.x-5,p.y+p.r+11,p.x+5,p.y+p.r+21,'#f3ab94',2);
          line(p.x-5,p.y+p.r+21,p.x+5,p.y+p.r+11,'#f3ab94',2);
        }
      }
      for(const p of G.particles) {
        const left=clamp(p.life/p.max,0,1);
        ctx.globalAlpha=left; ctx.fillStyle=p.color; ctx.beginPath(); ctx.arc(p.x,p.y,p.size*(0.4+0.6*left),0,Math.PI*2); ctx.fill();
      }
      ctx.globalAlpha=1;
      if (G.shot) {
        const x=G.shot.x*W,y=G.shot.y;
        const trail=ctx.createLinearGradient(x,y,x,y+24); trail.addColorStop(0,'#fff4d5'); trail.addColorStop(1,'#fff4d500');
        ctx.fillStyle=trail; rounded(x-2,y,4,24,2); ctx.fill();
        ctx.beginPath(); ctx.arc(x,y,2.8,0,Math.PI*2); ctx.fillStyle='#fff3ca'; ctx.fill();
      }
      ctx.fillStyle='#343b3b'; ctx.fillRect(0,L.railTop,W,H-L.railTop);
      line(0,L.railTop,W,L.railTop,'#d7e1ce29');
      line(23,H-42,W-23,H-42,'#d6e0cd18');
      line(23,H-45,23,H-39,'#abb8a540'); line(W-23,H-45,W-23,H-39,'#abb8a540');
      textAt('ZIEHEN',15,H-18,7,'#9aa99b','left');
      textAt('LOSLASSEN = SCHUSS',W-15,H-18,7,'#9aa99b','right');
      if (G.bounce && G.bounce.age<1) {
        const b=G.bounce, speed=Math.hypot(b.vx,b.vy), tail=Math.min(22,b.age*speed);
        const tx=b.x-b.vx/speed*tail, ty=b.y-b.vy/speed*tail;
        ctx.globalAlpha=clamp((1-b.age)/0.35,0,1);
        const trail=ctx.createLinearGradient(b.x,b.y,tx,ty); trail.addColorStop(0,'#fff4d5'); trail.addColorStop(1,'#fff4d500');
        ctx.beginPath(); ctx.moveTo(b.x,b.y); ctx.lineTo(tx,ty); ctx.strokeStyle=trail; ctx.lineWidth=4; ctx.lineCap='round'; ctx.stroke();
        ctx.beginPath(); ctx.arc(b.x,b.y,2.8,0,Math.PI*2); ctx.fillStyle='#fff3ca'; ctx.fill();
        ctx.globalAlpha=1;
      }
      drawGun(gunX,L.gunY,G.recoil);
      if (G.feedback) {
        const correct=G.feedback.kind==='correct';
        const message=correct?'GENAU!  +'+G.feedback.points:G.feedback.kind==='time'?'ZEIT ABGELAUFEN':G.feedback.kind==='miss'?'KNAPP VORBEI':'ANDERE NUANCE';
        textAt(message,W/2,L.railTop-12,10,correct?'#d5e8c7':'#f2c6a9');
      }
    }
    function resize() {
      const rect=canvas.getBoundingClientRect();
      if (rect.width<1 || rect.height<1) return;
      const oldW=W, oldH=H;
      W=rect.width; H=rect.height; DPR=Math.min(window.devicePixelRatio||1,2);
      canvas.width=Math.round(W*DPR); canvas.height=Math.round(H*DPR);
      // Droplets and the ricochet live in canvas pixels; after a new layout they would no longer match their sphere.
      if (W!==oldW || H!==oldH) { G.particles=[]; G.bounce=null; }
      if (G.shot && oldH>0) { G.shot.y=G.shot.y/oldH*H; G.shot.previousY=G.shot.y; }
      setGun(G.gunX);
      draw(performance.now());
    }
    canvas.addEventListener('pointerdown',event=>{
      if (G.phase!=='aim' || pointerId!==null || (event.pointerType==='mouse' && event.button!==0)) return;
      const rect=canvas.getBoundingClientRect();
      if (event.clientY-rect.top<layout().railTop-8) return;
      event.preventDefault();
      if (performance.now()>=G.deadline) { finishRound('time',null,performance.now()); return; }
      pointerId=event.pointerId;
      canvas.setPointerCapture(event.pointerId);
      canvas.classList.add('dragging');
      setGun((event.clientX-rect.left)/rect.width);
    });
    canvas.addEventListener('pointermove',event=>{
      if (event.pointerId!==pointerId || G.phase!=='aim') return;
      event.preventDefault();
      const rect=canvas.getBoundingClientRect();
      setGun((event.clientX-rect.left)/rect.width);
    });
    canvas.addEventListener('pointerup',event=>{
      if (event.pointerId!==pointerId) return;
      event.preventDefault();
      const rect=canvas.getBoundingClientRect();
      setGun((event.clientX-rect.left)/rect.width);
      const now=performance.now();
      clearInput();
      fire(now);
    });
    canvas.addEventListener('pointercancel',event=>{ if(event.pointerId===pointerId) clearInput(); });
    canvas.addEventListener('lostpointercapture',event=>{ if(event.pointerId===pointerId) clearInput(); });
    canvas.addEventListener('contextmenu',event=>event.preventDefault());
    overlay.addEventListener('click',event=>{
      const button=event.target.closest('button');
      if (!button) return;
      if (button.dataset.timeMode && TIME_MODES[button.dataset.timeMode] && ['intro','over'].includes(G.phase)) {
        timeMode=button.dataset.timeMode;
        G.seconds=TIME_MODES[timeMode].seconds;
        for (const b of panel.querySelectorAll('[data-time-mode]')) b.setAttribute('aria-pressed',String(b.dataset.timeMode===timeMode));
        const duration=panel.querySelector('#round-duration');
        if (duration) duration.textContent=roundSeconds();
        updateHud();
      } else if (button.dataset.mode && MODES[button.dataset.mode] && ['intro','over'].includes(G.phase)) {
        mode=button.dataset.mode;
        for (const b of panel.querySelectorAll('[data-mode]')) b.setAttribute('aria-pressed',String(b.dataset.mode===mode));
        updateHud();
        if (G.phase==='intro') generateBalls(G.color,true);
      } else if (button.dataset.action==='start' || button.dataset.action==='restart') startGame();
      else if (button.dataset.action==='resume') resumeGame();
      else if (button.dataset.action==='menu') returnToMenu();
    });
    $('sound').addEventListener('click',toggleSound);
    $('pause').addEventListener('click',()=>{ if(G.phase==='paused') resumeGame(); else pauseGame(); });
    window.addEventListener('keydown',event=>{
      if (event.code==='Escape' || event.code==='KeyP') {
        if (!event.repeat) { if(G.phase==='paused') resumeGame(); else pauseGame(); }
        return;
      }
      if (G.phase!=='aim') return;
      if (['ArrowLeft','ArrowRight','Space','KeyA','KeyD'].includes(event.code)) event.preventDefault();
      if(event.code==='ArrowLeft' || event.code==='KeyA') keys.left=true;
      if(event.code==='ArrowRight' || event.code==='KeyD') keys.right=true;
      if(event.code==='Space' && !event.repeat) spaceDown=true;
    });
    window.addEventListener('keyup',event=>{
      if(event.code==='ArrowLeft' || event.code==='KeyA') keys.left=false;
      if(event.code==='ArrowRight' || event.code==='KeyD') keys.right=false;
      if(event.code==='Space' && spaceDown) { event.preventDefault(); spaceDown=false; fire(); }
    });
    window.addEventListener('blur',()=>pauseGame());
    document.addEventListener('visibilitychange',()=>{ if(document.hidden) pauseGame(); });
    new ResizeObserver(resize).observe($('game'));
    G.color=COLORS[0]; generateBalls(G.color,true); updateHud(); updateSoundButton(); showPanel('intro'); resize();
    requestAnimationFrame(tick);
  })();
  </script>
</body>
</html>
